services:
  postgres:
    image: postgres:16
    container_name: cloudops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: cloudops
      POSTGRES_DB: cloudops_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
