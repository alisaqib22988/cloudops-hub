services:

  postgres:
    image: postgres:16
    container_name: cloudops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: cloudops
      POSTGRES_DB: cloudops_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: cloudops-hub-backend
    ports:
      - "8001:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8001
    container_name: cloudops-hub-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
